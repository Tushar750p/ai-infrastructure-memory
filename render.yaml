services:
  - type: web
    name: aime-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_NAME
        value: "aime_session"
      - key: AWS_SESSION_DURATION_SECONDS
        value: "900"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: "AIME <no-reply@example.com>"
      - key: SMTP_USE_TLS
        value: "true"
      - key: PASSWORD_RESET_URL
        sync: false
      - key: EMAIL_VERIFICATION_URL
        sync: false
