# Local development dependencies only.
# Run the FastAPI backend and Next.js frontend natively for lower RAM usage.
# This file intentionally does not start the production application stack.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: infra_memory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AIME_DB_PASSWORD:-aime_local_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aime_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infra_memory"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  aime_pgdata:
