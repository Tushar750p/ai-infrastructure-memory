name: Production Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  TF_DIR: infrastructure/terraform/prod

jobs:
  test:
    uses: ./.github/workflows/backend-tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve ECR repositories
        id: repos
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "backend=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/aime/backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/aime/frontend" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repositories exist
        run: |
          aws ecr describe-repositories --repository-names aime/backend aime/frontend >/dev/null 2>&1 || {
            terraform -chdir="$TF_DIR" init
            terraform -chdir="$TF_DIR" apply -auto-approve \
              -target=aws_ecr_repository.backend \
              -target=aws_ecr_repository.frontend \
              -var="db_password=${{ secrets.AIME_DB_PASSWORD }}" \
              -var="credentials_encryption_key=${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}" \
              -var="cors_allowed_origins=${{ secrets.CORS_ALLOWED_ORIGINS }}" \
              -var="password_reset_url=${{ secrets.PASSWORD_RESET_URL }}" \
              -var="email_verification_url=${{ secrets.EMAIL_VERIFICATION_URL }}" \
              -var="backend_image=public.ecr.aws/docker/library/python:3.12-slim" \
              -var="frontend_image=public.ecr.aws/docker/library/node:22-alpine"
          }

      - name: Build and push backend
        run: |
          docker build -t "${{ steps.repos.outputs.backend }}:${GITHUB_SHA}" ./backend
          docker push "${{ steps.repos.outputs.backend }}:${GITHUB_SHA}"

      - name: Build and push frontend
        run: |
          docker build -t "${{ steps.repos.outputs.frontend }}:${GITHUB_SHA}" ./frontend
          docker push "${{ steps.repos.outputs.frontend }}:${GITHUB_SHA}"

      - name: Terraform init
        run: terraform -chdir="$TF_DIR" init

      - name: Terraform validate
        run: terraform -chdir="$TF_DIR" validate

      - name: Terraform apply
        env:
          TF_VAR_db_password: ${{ secrets.AIME_DB_PASSWORD }}
          TF_VAR_credentials_encryption_key: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          TF_VAR_cors_allowed_origins: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          TF_VAR_password_reset_url: ${{ secrets.PASSWORD_RESET_URL }}
          TF_VAR_email_verification_url: ${{ secrets.EMAIL_VERIFICATION_URL }}
          TF_VAR_smtp_host: ${{ secrets.SMTP_HOST }}
          TF_VAR_smtp_username: ${{ secrets.SMTP_USERNAME }}
          TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
          TF_VAR_backend_image: ${{ steps.repos.outputs.backend }}:${GITHUB_SHA}
          TF_VAR_frontend_image: ${{ steps.repos.outputs.frontend }}:${GITHUB_SHA}
        run: terraform -chdir="$TF_DIR" apply -auto-approve

      - name: ECS deployment status
        run: |
          aws ecs wait services-stable --cluster aime-cluster --services aime-backend aime-frontend
