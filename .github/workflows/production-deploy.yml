name: Production Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  TF_DIR: infrastructure/terraform/prod

jobs:
  test:
    uses: ./.github/workflows/backend-tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve ECR repositories
        id: repos
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "backend=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/aime/backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/aime/frontend" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repositories exist
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names aime/backend aime/frontend >/dev/null 2>&1 || {
            aws ecr create-repository --repository-name aime/backend --image-tag-mutability IMMUTABLE --image-scanning-configuration scanOnPush=true >/dev/null
            aws ecr create-repository --repository-name aime/frontend --image-tag-mutability IMMUTABLE --image-scanning-configuration scanOnPush=true >/dev/null
          }

      - name: Prepare application secret
        id: app_secret
        env:
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          PASSWORD_RESET_URL: ${{ secrets.PASSWORD_RESET_URL }}
          EMAIL_VERIFICATION_URL: ${{ secrets.EMAIL_VERIFICATION_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
        run: |
          set -euo pipefail
          SECRET_NAME="aime/prod/app"
          SECRET_JSON="$(jq -n             --arg key "$CREDENTIALS_ENCRYPTION_KEY"             --arg cors "$CORS_ALLOWED_ORIGINS"             --arg reset "$PASSWORD_RESET_URL"             --arg verify "$EMAIL_VERIFICATION_URL"             --arg host "$SMTP_HOST"             --arg port "$SMTP_PORT"             --arg user "$SMTP_USERNAME"             --arg pass "$SMTP_PASSWORD"             --arg from "$SMTP_FROM"             --arg tls "$SMTP_USE_TLS"             '{CREDENTIALS_ENCRYPTION_KEY:$key,CORS_ALLOWED_ORIGINS:$cors,PASSWORD_RESET_URL:$reset,EMAIL_VERIFICATION_URL:$verify,SMTP_HOST:$host,SMTP_PORT:$port,SMTP_USERNAME:$user,SMTP_PASSWORD:$pass,SMTP_FROM:$from,SMTP_USE_TLS:$tls}')"
          if ARN="$(aws secretsmanager describe-secret --secret-id "$SECRET_NAME" --query ARN --output text 2>/dev/null)"; then
            aws secretsmanager put-secret-value --secret-id "$ARN" --secret-string "$SECRET_JSON" >/dev/null
          else
            ARN="$(aws secretsmanager create-secret --name "$SECRET_NAME" --secret-string "$SECRET_JSON" --query ARN --output text)"
          fi
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        run: |
          docker build -t "${{ steps.repos.outputs.backend }}:${GITHUB_SHA}" ./backend
          docker push "${{ steps.repos.outputs.backend }}:${GITHUB_SHA}"

      - name: Build and push frontend
        run: |
          docker build -t "${{ steps.repos.outputs.frontend }}:${GITHUB_SHA}" ./frontend
          docker push "${{ steps.repos.outputs.frontend }}:${GITHUB_SHA}"

      - name: Terraform init
        run: terraform -chdir="$TF_DIR" init

      - name: Terraform format check
        run: terraform -chdir="$TF_DIR" fmt -check -recursive

      - name: Terraform validate
        run: terraform -chdir="$TF_DIR" validate

      - name: Terraform apply
        env:
          TF_VAR_credentials_encryption_key: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          TF_VAR_backend_image: ${{ steps.repos.outputs.backend }}:${GITHUB_SHA}
          TF_VAR_frontend_image: ${{ steps.repos.outputs.frontend }}:${GITHUB_SHA}
          TF_VAR_app_secrets_arn: ${{ steps.app_secret.outputs.arn }}
          TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERTIFICATE_ARN }}
        run: terraform -chdir="$TF_DIR" apply -auto-approve

      - name: Run Alembic migration task
        shell: bash
        run: |
          set -euo pipefail
          TASK_DEF="$(terraform -chdir="$TF_DIR" output -raw migration_task_definition)"
          SUBNETS="$(terraform -chdir="$TF_DIR" output -json private_subnet_ids | jq -r 'join(",")')"
          SG="$(terraform -chdir="$TF_DIR" output -raw ecs_security_group_id)"
          TASK_ARN="$(aws ecs run-task             --cluster aime-cluster             --task-definition "$TASK_DEF"             --launch-type FARGATE             --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}"             --query 'tasks[0].taskArn' --output text)"
          aws ecs wait tasks-stopped --cluster aime-cluster --tasks "$TASK_ARN"
          EXIT_CODE="$(aws ecs describe-tasks --cluster aime-cluster --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)"
          test "$EXIT_CODE" = "0"

      - name: ECS deployment status
        run: |
          aws ecs wait services-stable --cluster aime-cluster --services aime-backend aime-frontend
