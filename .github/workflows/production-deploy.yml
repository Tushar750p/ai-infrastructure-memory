name: Production Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  TF_DIR: infrastructure/terraform/prod

jobs:
  test:
    uses: ./.github/workflows/backend-tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve ECR repositories
        id: repos
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "backend=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/aime/backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/aime/frontend" >> "$GITHUB_OUTPUT"
          echo "state_bucket=aime-prod-tfstate-${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
          echo "state_table=aime-prod-tf-locks" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repositories exist
        run: |
          set -euo pipefail
          for repo in aime/backend aime/frontend; do
            if ! aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1; then
              aws ecr create-repository --repository-name "$repo" --image-tag-mutability IMMUTABLE --image-scanning-configuration scanOnPush=true >/dev/null
            fi
          done

      - name: Prepare application secret
        id: app_secret
        env:
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          PASSWORD_RESET_URL: ${{ secrets.PASSWORD_RESET_URL }}
          EMAIL_VERIFICATION_URL: ${{ secrets.EMAIL_VERIFICATION_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
        run: |
          set -euo pipefail
          SECRET_NAME="aime/prod/app"
          SMTP_PORT="${SMTP_PORT:-587}"
          SMTP_FROM="${SMTP_FROM:-AIME <no-reply@example.com>}"
          SMTP_USE_TLS="${SMTP_USE_TLS:-true}"
          SECRET_JSON="$(jq -n             --arg key "$CREDENTIALS_ENCRYPTION_KEY"             --arg cors "$CORS_ALLOWED_ORIGINS"             --arg reset "$PASSWORD_RESET_URL"             --arg verify "$EMAIL_VERIFICATION_URL"             --arg host "$SMTP_HOST"             --arg port "$SMTP_PORT"             --arg user "$SMTP_USERNAME"             --arg pass "$SMTP_PASSWORD"             --arg from "$SMTP_FROM"             --arg tls "$SMTP_USE_TLS"             '{CREDENTIALS_ENCRYPTION_KEY:$key,CORS_ALLOWED_ORIGINS:$cors,PASSWORD_RESET_URL:$reset,EMAIL_VERIFICATION_URL:$verify,SMTP_HOST:$host,SMTP_PORT:$port,SMTP_USERNAME:$user,SMTP_PASSWORD:$pass,SMTP_FROM:$from,SMTP_USE_TLS:$tls}')"
          if ARN="$(aws secretsmanager describe-secret --secret-id "$SECRET_NAME" --query ARN --output text 2>/dev/null)"; then
            aws secretsmanager put-secret-value --secret-id "$ARN" --secret-string "$SECRET_JSON" >/dev/null
          else
            ARN="$(aws secretsmanager create-secret --name "$SECRET_NAME" --secret-string "$SECRET_JSON" --query ARN --output text)"
          fi
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        run: |
          docker build -t "${{ steps.repos.outputs.backend }}:${GITHUB_SHA}" ./backend
          docker push "${{ steps.repos.outputs.backend }}:${GITHUB_SHA}"

      - name: Build and push frontend
        run: |
          docker build -t "${{ steps.repos.outputs.frontend }}:${GITHUB_SHA}" ./frontend
          docker push "${{ steps.repos.outputs.frontend }}:${GITHUB_SHA}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Bootstrap Terraform state storage
        env:
          STATE_BUCKET: ${{ steps.repos.outputs.state_bucket }}
          STATE_TABLE: ${{ steps.repos.outputs.state_table }}
        run: |
          set -euo pipefail
          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION" --create-bucket-configuration LocationConstraint="$AWS_REGION"
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$STATE_BUCKET" --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi
          aws dynamodb describe-table --table-name "$STATE_TABLE" >/dev/null 2>&1 || aws dynamodb create-table --table-name "$STATE_TABLE" --billing-mode PAY_PER_REQUEST --attribute-definitions AttributeName=LockID,AttributeType=S --key-schema AttributeName=LockID,KeyType=HASH >/dev/null
          aws dynamodb wait table-exists --table-name "$STATE_TABLE"

      - name: Terraform init
        run: terraform -chdir="$TF_DIR" init -backend-config="bucket=${{ steps.repos.outputs.state_bucket }}" -backend-config="key=prod/terraform.tfstate" -backend-config="region=${{ env.AWS_REGION }}" -backend-config="dynamodb_table=${{ steps.repos.outputs.state_table }}" -backend-config="encrypt=true"

      - name: Terraform format
        run: terraform -chdir="$TF_DIR" fmt -recursive

      - name: Terraform validate
        run: terraform -chdir="$TF_DIR" validate

      - name: Terraform apply
        env:
          TF_VAR_backend_image: ${{ steps.repos.outputs.backend }}:${GITHUB_SHA}
          TF_VAR_frontend_image: ${{ steps.repos.outputs.frontend }}:${GITHUB_SHA}
          TF_VAR_app_secrets_arn: ${{ steps.app_secret.outputs.arn }}
          TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERTIFICATE_ARN }}
        run: terraform -chdir="$TF_DIR" apply -auto-approve

      - name: Run Alembic migration task
        shell: bash
        run: |
          set -euo pipefail
          CLUSTER="$(terraform -chdir="$TF_DIR" output -raw ecs_cluster_name)"
          TASK_DEF="$(terraform -chdir="$TF_DIR" output -raw migration_task_definition)"
          SUBNETS="$(terraform -chdir="$TF_DIR" output -json private_subnet_ids | jq -r 'join(",")')"
          SG="$(terraform -chdir="$TF_DIR" output -raw ecs_security_group_id)"
          TASK_ARN="$(aws ecs run-task             --cluster "$CLUSTER"             --task-definition "$TASK_DEF"             --launch-type FARGATE             --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}"             --query 'tasks[0].taskArn' --output text)"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE="$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)"
          test "$EXIT_CODE" = "0"

      - name: ECS deployment status
        run: |
          CLUSTER="$(terraform -chdir="$TF_DIR" output -raw ecs_cluster_name)"
          BACKEND_SERVICE="$(terraform -chdir="$TF_DIR" output -raw ecs_backend_service_name)"
          FRONTEND_SERVICE="$(terraform -chdir="$TF_DIR" output -raw ecs_frontend_service_name)"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$BACKEND_SERVICE" "$FRONTEND_SERVICE"
